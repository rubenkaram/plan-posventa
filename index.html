<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de Negocios Posventa</title>
<style>
:root{
  /* Tablero de gestión posventa: cabecera azul institucional, tablas densas tipo planilla */
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f5f7fa; --muted-fill:#eef0f3; --line:#e3e6eb; --line-2:#cfd5dd; --line-3:#f0f2f5;
  --ink:#16191f; --ink-2:#4b5361; --ink-3:#7a8392;
  --brand:#123c6e; --brand-2:#1d5aa0; --brand-soft:#e8f0fa; --on-brand:#ffffff;
  --hdr:#0070c0; --hdr-ink:#fff;
  --good:#0a7d0a; --good-bg:#e7f6e7; --warn:#a86b00; --warn-bg:#fff4dc; --bad:#c22f2f; --bad-bg:#fdeaea; --bad-line:#f0c4c4;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#6250d6;
  --auto:#1d5aa0; --auto-bg:#eef5fd; --hl:#e6fbfb; --ov:#fffbe6; --toast:#16191f; --toast-ink:#ffffff; --overlay:rgba(10,14,20,.45);
  --radius:8px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1c2027; --surface-2:#20252d; --surface-3:#232933; --muted-fill:#2a303a; --line:#2f3640; --line-2:#3c4450; --line-3:#262c35;
  --ink:#e9ecf1; --ink-2:#b6bdc8; --ink-3:#8a93a1; --brand:#1b4a85; --brand-2:#4f8fd8; --brand-soft:#1d2c42; --hdr:#155e9c;
  --good:#4cc34c; --good-bg:#16301a; --warn:#e2a93a; --warn-bg:#352a12; --bad:#ef6b6b; --bad-bg:#3a1c1c; --bad-line:#5a2a2a;
  --auto:#7fb2ee; --auto-bg:#1a2738; --hl:#163338; --ov:#332d14; --toast:#e9ecf1; --toast-ink:#14171c; --overlay:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1c2027; --surface-2:#20252d; --surface-3:#232933; --muted-fill:#2a303a; --line:#2f3640; --line-2:#3c4450; --line-3:#262c35;
  --ink:#e9ecf1; --ink-2:#b6bdc8; --ink-3:#8a93a1; --brand:#1b4a85; --brand-2:#4f8fd8; --brand-soft:#1d2c42; --hdr:#155e9c;
  --good:#4cc34c; --good-bg:#16301a; --warn:#e2a93a; --warn-bg:#352a12; --bad:#ef6b6b; --bad-bg:#3a1c1c; --bad-line:#5a2a2a;
  --auto:#7fb2ee; --auto-bg:#1a2738; --hl:#163338; --ov:#332d14; --toast:#e9ecf1; --toast-ink:#14171c; --overlay:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal p{margin:0 0 14px;line-height:1.45}
.btn:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
#cloudStatus{font-size:12px;opacity:.85}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--brand);color:var(--on-brand);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .sub{font-size:12px;opacity:.8}
header.top .sp{flex:1}
header.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:var(--on-brand)}
header.top .btn:hover{background:rgba(255,255,255,.22)}
#saveStatus{font-size:12px;opacity:.75}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:52px;z-index:19}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}
main{padding:18px 20px 60px;max-width:1800px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.panel h3{font-size:13px;margin:14px 0 8px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)} .small{font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}

/* tablas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:6px;max-height:calc(100vh - 210px);background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
table.t th,table.t td{padding:4px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-3);white-space:nowrap;text-align:right}
table.t thead th{background:var(--hdr);color:var(--hdr-ink);font-weight:600;text-align:center;position:sticky;top:0;z-index:3}
table.t thead tr:nth-child(2) th{top:25px}
table.t thead tr:nth-child(3) th{top:50px}
table.t td.lbl,table.t th.lbl{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
table.t td.lbl2{text-align:left;position:sticky;left:150px;background:var(--surface);z-index:2}
table.t thead th.lbl{z-index:4;background:var(--hdr)}
table.t tr.sec td{background:var(--brand-soft);font-weight:700;text-align:left;color:var(--brand)}
table.t tr.sec td.lbl{background:var(--brand-soft)}
table.t tr.strong td{font-weight:700}
table.t tr.hl td{background:var(--hl)}
table.t tr.hl td.lbl,table.t tr.hl td.lbl2{background:var(--hl)}
table.t td.o{color:var(--ink-2)}
table.t td.g-pos{color:var(--good)} table.t td.g-neg{color:var(--bad)}
table.t td.tot{background:var(--surface-3)}
table.t td.sepL,table.t th.sepL{border-left:2px solid var(--line-2)}
table.t td.in{padding:0}
table.t td.in input{width:100%;min-width:92px;border:0;border-radius:0;padding:4px 7px;text-align:right;background:transparent}
table.t td.in input:focus{outline:2px solid var(--brand-2);background:var(--surface)}
table.t td.in input.ov{font-weight:700;background:var(--ov)}
table.t td.in input.auto::placeholder{color:var(--auto);font-style:italic;opacity:1}
table.t td.calc{background:var(--surface-2);color:var(--ink-2)}
table.t td.ref{color:var(--auto);font-style:italic;background:var(--auto-bg)}
.legend-dots{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend-dots span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:relative}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .o{font-size:12px;color:var(--ink-3)}
.kpi .bar{height:6px;background:var(--muted-fill);border-radius:4px;margin-top:8px;overflow:hidden;position:relative}
.kpi .bar i{display:block;height:100%;border-radius:4px;background:var(--series-1)}
.kpi .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:10px;position:absolute;top:10px;right:10px}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.na{background:var(--muted-fill);color:var(--ink-3)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--muted-fill);color:var(--ink-2)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.auto{background:var(--auto-bg);color:var(--auto)}

.drop{border:2px dashed var(--line-2);border-radius:var(--radius);padding:22px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand-2);background:var(--brand-soft)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.chartbox h3{margin:0 0 2px;font-size:14px;font-weight:600}
.chartbox p{margin:0 0 10px;font-size:12px;color:var(--ink-3)}
.chartbox .cv{position:relative;height:290px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.subtabs button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.notice{padding:10px 12px;border-radius:6px;background:var(--auto-bg);color:var(--brand);font-size:13px;margin-bottom:12px}
.notice.warn{background:var(--warn-bg);color:#7a4e00}
.cual-sec{border:1px solid var(--line);border-radius:6px;margin-bottom:12px}
.cual-sec>div.h{background:var(--brand-soft);color:var(--brand);font-weight:700;padding:8px 12px}
.cual-obj{display:grid;grid-template-columns:110px 1fr 240px 140px 130px 34px;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:start}
.cual-obj textarea{width:100%;min-height:38px;resize:vertical}
.cual-obj input,.cual-obj select{width:100%}
.est-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:1fr 130px;gap:6px 10px;align-items:center;font-size:13px}
.kv input{text-align:right}
.kv .calcv{text-align:right;font-weight:600;padding:6px 8px;background:var(--surface-2);border-radius:6px}
.report h2.rt{font-size:20px;margin:0}
.highlights{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.highlights ul{margin:6px 0 0;padding-left:18px} .highlights li{margin:4px 0}
@media (max-width:760px){ main{padding:12px} .grid2,.charts,.highlights{grid-template-columns:1fr} .cual-obj{grid-template-columns:1fr} header.top{position:static} nav.tabs{top:0} }
@media print{
  header.top,nav.tabs,.noprint{display:none!important}
  body{background:var(--surface)} main{padding:0;max-width:none} .panel{border:0;padding:0}
  .tw{max-height:none;overflow:visible;border:0}
  .kpi{break-inside:avoid}
}
</style>
</head>

function smGroup(code) {
  const c = String(code || '').toUpperCase().replace(/\s+/g, '');
  if (S.cfg.smOverride && S.cfg.smOverride[c]) return S.cfg.smOverride[c];
  // Codificación GUDB Ford: SM + nº de servicio (2 dígitos) + variante de plan (01/02/03/04) o IOLM
  //   SM0103 → SM01 · SM1003 → SM10 · SM1103 → SM11+ · SM02IOLM → SM02
  const m = c.match(/^SM(\d+)/);
  if (!m) return null;
  const n = parseInt(m[1].slice(0, 2), 10);
  if (!isFinite(n) || n < 1) return null;

  return 'SM' + String(n).padStart(2, '0');
}
function opCategory(op) {

  const H = rows[hdr].map(normH);

  const C = {
    ro: 0,
    cierre: find(h => h.includes('fecha de cierre'), 3),
    apertura: find(h => h.includes('fecha apertura'), 2),
    vin: find(h => h.includes('vin del vehiculo'), 5),
    rec: find(h => h.includes('reconocido por ford'), 6),

    opDesc: find(h => h.includes('descripcion de la operacion'), 27),
    op: find(h => h.startsWith('codigo de operacion de la mano de obra'), 28),
    costU: find(h => h.includes('costo unitario'), 31),

  // período

    if (m) periodo = {desde: `${m[1]}-${m[2]}-${m[3]}`, hasta: `${m[4]}-${m[5]}-${m[6]}`, anio: +m[1], mes: +m[2]};

    return null;

    if (!r || !r[C.ro]) continue;
    const ro = String(r[C.ro]).trim();
    if (normH(ro).startsWith('costo total')) continue;
    const vin = String(r[C.vin] || '').trim().toUpperCase();
    if (!vin) continue;
    const d = toDate(r[C.cierre]);
    if (d) { const k = d.getFullYear() + '-' + (d.getMonth() + 1); mesCount[k] = (mesCount[k] || 0) + 1; }

// lines: [ro, vin, pay, op, extCost, extPrice, mo, desc, qty]

      costoMoTaller: at(sr.mant.costo, i) + at(sr.rep.costo, i) + at(sr.cub.costo, i),
      moCyp: cPartMO + cSegMO, costoMoCyp: at(cy.part.costo, i) + at(cy.seg.costo, i),
      moAcc: O.acc.moVenta[i], costoMoAcc: O.acc.moCosto[i],
      moGar: at(g.pasos, i) * at(g.moPaso, i), costoMoGar: at(g.costo, i),
      repTaller: repMant + repRep + repCub,
      costoRepTaller: at(sr.repMant.costo, i) + at(sr.repRep.costo, i) + at(sr.repCub.costo, i),
      repCyp: cRepPart + cRepSeg, costoRepCyp: at(cy.repPart.costo, i) + at(cy.repSeg.costo, i),

      movilPasos: null, movilFact: null, movilCosto: null,
      _empty: false
    });
  }
  return out;
}

function aggBase(list) {
  const t = {};
  BASE_KEYS.forEach(k => {
    const vals = list.map(b => b[k]).filter(isNum);
    if (!vals.length) { t[k] = null; return; }
    t[k] = AVG_KEYS.includes(k) ? vals.reduce((a, b) => a + b, 0) / vals.length : vals.reduce((a, b) => a + b, 0);
  });
  t.tecnicos = (isNum(t.staffMant) || isNum(t.staffRep)) ? nz(t.staffMant) + nz(t.staffRep) : t.tecnicos;
  t.areas = (isNum(t.areasMant) || isNum(t.areasRep)) ? nz(t.areasMant) + nz(t.areasRep) : t.areas;
  t._empty = list.every(b => b._empty);
  return t;
}

/* ---------- derivados (mismas fórmulas que PROYECCION - Cuantitativos) ---------- */
function derive(b) {
  const d = Object.assign({}, b);
  const N = k => nz(b[k]);
  d.pdtMant = div(N('pasosMant'), N('dias') * N('staffMant'));
  d.pdtRep = div(N('pasosRep'), N('staffRep') * N('dias'));
  d.pasosTot = N('pasosMant') + N('pasosRep');
  d.pdArea = div(d.pasosTot, N('dias') * N('areas'));
  d.ratioInst = div(N('pasosAcc'), N('venta0km'));
  // margen: si hay venta pero falta el costo, el margen queda sin dato (no se asume costo 0)
  const mbOf = (v, c) => (isNum(b[v]) && b[v] !== 0 && !isNum(b[c])) ? null : N(v) - N(c);
  const sumN = (...ks) => ks.some(k => isNum(b[k])) ? ks.reduce((a, k) => a + N(k), 0) : null;
  const sumV = (...vs) => vs.some(v => v === null) ? null : vs.reduce((a, v) => a + v, 0);
  const blk = (v, c, p, pre) => { d[pre + 'Vp'] = div(b[v], p); d[pre + 'Mb'] = mbOf(v, c); d[pre + 'Pct'] = div(d[pre + 'Mb'], N(v)); };
  blk('moTaller', 'costoMoTaller', d.pasosTot, 'moT');
  blk('moCyp', 'costoMoCyp', N('pasosCyp'), 'moC');
  blk('moAcc', 'costoMoAcc', N('pasosAcc'), 'moA');
  blk('moGar', 'costoMoGar', N('pasosGar'), 'moG');
  d.moTot = sumN('moTaller', 'moCyp', 'moAcc', 'moGar');
  d.moTotMb = sumV(d.moTMb, d.moCMb, d.moAMb, d.moGMb);
  d.costoMoTot = d.moTotMb === null ? sumN('costoMoTaller', 'costoMoCyp', 'costoMoAcc', 'costoMoGar') : nz(d.moTot) - d.moTotMb;
  d.moTotPct = div(d.moTotMb, d.moTot);
  blk('repTaller', 'costoRepTaller', d.pasosTot, 'rT');
  blk('repCyp', 'costoRepCyp', N('pasosCyp'), 'rC');
  blk('repAcc', 'costoRepAcc', N('pasosAcc'), 'rA');
  d.repTot = sumN('repTaller', 'repCyp', 'repAcc');
  d.repTotMb = sumV(d.rTMb, d.rCMb, d.rAMb);
  d.costoRepTot = sumN('costoRepTaller', 'costoRepCyp', 'costoRepAcc');
  d.repTotPct = div(d.repTotMb, d.repTot);
  d.extTot = sumN('extMos', 'extMay', 'extSeg');
  d.cExtTot = sumN('cExtMos', 'cExtMay', 'cExtSeg');
  d.mbExtMos = mbOf('extMos', 'cExtMos'); d.mbExtMay = mbOf('extMay', 'cExtMay'); d.mbExtSeg = mbOf('extSeg', 'cExtSeg');
  d.mbExtTot = d.extTot === null ? null : sumV(d.mbExtMos, d.mbExtMay, d.mbExtSeg);
  d.pctExtMos = div(d.mbExtMos, N('extMos')); d.pctExtMay = div(d.mbExtMay, N('extMay')); d.pctExtSeg = div(d.mbExtSeg, N('extSeg')); d.pctExtTot = div(d.mbExtTot, d.extTot);
  d.movilMb = N('movilFact') - N('movilCosto'); d.movilPct = div(d.movilMb, N('movilFact'));
  // facturación y margen total: sólo si están cargadas las tres líneas (MO, repuestos internos y externos)
  d.fact = sumV(d.moTot, d.repTot, d.extTot);
  d.costoTot = d.fact === null ? null : sumV(d.costoMoTot, d.costoRepTot, d.cExtTot);
  d.mbTot = d.fact === null ? null : sumV(d.moTotMb, d.repTotMb, d.mbExtTot);
  d.pctTot = div(d.mbTot, d.fact);
  return d;
}

function buildModel(upto) {

  const lim = upto || 12;
  const obj = ob.map(derive), res = rb.map(derive);
  const objT = derive(aggBase(ob)), resT = derive(aggBase(rb));
  const objY = derive(aggBase(ob.slice(0, lim))), resY = derive(aggBase(rb.slice(0, lim)));
  const lyHas = Object.values(S.ly || {}).some(isNum);
  const lyB = {}; BASE_KEYS.forEach(k => lyB[k] = isNum(S.ly[k]) ? S.ly[k] : null);
  const ly = lyHas ? derive(lyB) : null;
  return {obj, res, objT, resT, objY, resY, ly, rb, ob};
}

/* ---------- turnos online concluidos (export del tablero de turnos Ford) ---------- */
function parseTurnosWorkbook(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null});
  const hi = rows.findIndex(r => r && r.some(c => normH(c) === 'estado de turno'));
  if (hi < 0) throw new Error('No reconozco el formato. Se esperan los exports del tablero de turnos Ford: el de turnos de agenda (columna “Estado de Turno”) o el de turnos concluidos por VIN (columnas “VIN GUDB” / “En Agenda”).');
  const H = rows[hi].map(normH), ix = k => H.findIndex(h => h === k || h.startsWith(k));
  const C = {est: ix('estado de turno'), cierre: ix('fecha de cierre'), turno: ix('fecha del turno'), vin: ix('vin'), nps: ix('nps'), fuente: ix('fuente de agendamiento'), com: ix('comentarios'), or: ix('nro. or'), suc: ix('sucursal')};
  const out = {concl: 0, sinOS: 0, otros: 0, fuentes: {}, nps: [], comentarios: [], vins: new Set(), mesCount: {}, sucursal: ''};
  const toD = v => v instanceof Date ? v : (typeof v === 'number' ? (d => d ? new Date(d.y, d.m - 1, d.d) : null)(XLSX.SSF.parse_date_code(v)) : null);
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r[C.est]) continue;
    const est = String(r[C.est]);
    if (/\(60\)/.test(est) || /^concluido$/i.test(est.replace(/\(\d+\)\s*/, ''))) out.concl++;
    else if (/sin os/i.test(est)) out.sinOS++; else out.otros++;
    const f = String(r[C.fuente] || 'Sin dato'); out.fuentes[f] = (out.fuentes[f] || 0) + 1;
    let nps = r[C.nps];
    if (nps instanceof Date) nps = Math.round((nps.getTime() - nps.getTimezoneOffset() * 60000 - Date.UTC(1899, 11, 30)) / 86400000);  // celda con formato fecha
    if (typeof nps === 'string' && nps.trim() !== '' && isFinite(+nps)) nps = +nps;
    if (isNum(nps) && nps >= 0 && nps <= 10) out.nps.push(nps);
    if (C.com >= 0 && r[C.com]) out.comentarios.push(String(r[C.com]));
    if (r[C.vin]) out.vins.add(String(r[C.vin]).trim().toUpperCase());
    const d = toD(r[C.cierre]) || toD(r[C.turno]);
    if (d) { const k = d.getFullYear() + '-' + (d.getMonth() + 1); out.mesCount[k] = (out.mesCount[k] || 0) + 1; }
    if (C.suc >= 0 && r[C.suc] && !out.sucursal) out.sucursal = String(r[C.suc]);
  }
  const best = Object.entries(out.mesCount).sort((a, b) => b[1] - a[1])[0];
  out.periodo = best ? {anio: +best[0].split('-')[0], mes: +best[0].split('-')[1]} : null;
  out.vins = out.vins.size;
  return out;
}

/* ---------- listado de OR facturadas del DMS (Autologica: Informe resumen de órdenes de reparación) ---------- */
function parseDMSWorkbook(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''});
  let periodo = null, taller = '', filtro = '';
  const ors = [];
  for (const r of rows) {
    const txt = r.map(x => String(x)).join(' ');
    const mp = txt.match(/Fecha entre\s+(\d{1,2})\/(\d{1,2})\/(\d{4})\s+y\s+(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (mp && !periodo) { periodo = {mes: +mp[2], anio: +mp[3], desde: `${mp[3]}-${mp[2].padStart(2, '0')}-${mp[1].padStart(2, '0')}`, hasta: `${mp[6]}-${mp[5].padStart(2, '0')}-${mp[4].padStart(2, '0')}`}; filtro = txt.trim(); }
    if (String(r[1]).trim() === 'Taller:') { taller = [r[2], r[4]].filter(Boolean).join(' - '); continue; }
    const orCell = r.find(x => /^\s*\d{2,4}\s*-\s*\d{6,}\s*$/.test(String(x)));
    if (!orCell) continue;
    const vin = String(r.find(x => /^[A-HJ-NPR-Z0-9]{17}$/i.test(String(x).trim())) || '').trim().toUpperCase();
    const iOr = r.indexOf(orCell);
    const fNum = r.slice(iOr + 1).find(x => x instanceof Date || (typeof x === 'number' && x > 40000 && x < 60000));
    const pad = n => String(n).padStart(2, '0');
    const fecha = fNum instanceof Date ? `${fNum.getFullYear()}-${pad(fNum.getMonth() + 1)}-${pad(fNum.getDate())}`
      : fNum ? (d => d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : '')(XLSX.SSF.parse_date_code(fNum)) : '';
    const texts = r.filter(x => typeof x === 'string' && x.trim());
    const iTxt = texts.indexOf(String(orCell));
    ors.push({or: roKey(orCell), orRaw: String(orCell).trim(), vin, fecha, cliente: texts[iTxt + 2] || '', modelo: texts[iTxt + 3] || '', taller, estado: texts.find(x => /FACTURAD|ABIERT|CERRAD/i.test(x)) || ''});
  }
  return {periodo, ors, filtro};
}
// cruce DMS ↔ GUDB de un mes
function dmsCruce(m) {
  const d = S.dms && S.dms[m]; if (!d) return null;
  const r = S.ro[m]; const lines = (r && r.lines) || [];
  const byRo = {};
  lines.forEach(l => { const k = roKey(l[0]); (byRo[k] = byRo[k] || []).push(l); });
  const enGudb = d.ors.filter(o => byRo[o.or]);
  const enGudbSinC = enGudb.filter(o => !byRo[o.or].some(l => l[2] === 'C'));
  const soloDms = dmsOnly(m);
  const prev = new Set(); for (let k = 1; k < m; k++) gudbRoSet(k).forEach(x => prev.add(x));
  const enOtroMes = d.ors.filter(o => !byRo[o.or] && prev.has(o.or));
  const dmsSet = new Set(d.ors.map(o => o.or));
  const soloGudb = Object.entries(byRo).filter(([k, L]) => L.some(l => l[2] === 'C') && !dmsSet.has(k))
    .map(([k, L]) => ({or: k, vin: L[0][1], apertura: L[0][10] || '', ops: [...new Set(L.filter(l => l[2] === 'C').map(l => l[3]))].join(', ')}));
  const vinGudbC = new Set(lines.filter(l => l[2] === 'C').map(l => l[1]));
  return {d, enGudb, enGudbSinC, soloDms, enOtroMes, soloGudb, vinGudbC, vinDms: new Set(d.ors.map(o => o.vin)).size};
}

    const mm = per.match(/^([A-Za-z]{3})[a-z]*[-\s/](\d{4})$/);
    if (!mm) continue;
    if (!out.periodo) out.periodo = {mes: MES[mm[1].toLowerCase()], anio: +mm[2]};
    const vg = String(r[C.vg] || '').trim().toUpperCase();
    if (/^si$/i.test(String(r[C.ea] || ''))) out.enAgenda++;
    if (vg && /^si$/i.test(String(r[C.eg] || 'Si'))) out.vins.push(vg); else out.soloAgenda++;
  }
  return out;
}
// cómo se reparten los VIN que Ford computa, según nuestras categorías
function fordCruce(m) {
  const f = S.fordConcl && S.fordConcl[m]; const r = S.ro[m]; if (!f || !r) return null;
  const F = new Set(f.vins), V = {};
  r.lines.forEach(l => { const v = V[l[1]] = V[l[1]] || {pays: new Set(), ops: new Set(), rec: l[9] || 'S'}; v.pays.add(l[2]); v.ops.add(l[3]); });
  const cat = v => { if (v.pays.has('C')) { const ops = [...v.ops]; return ops.some(o => smGroup(o)) ? 'SM' : 'Otros cargo cliente'; } return v.pays.has('W') ? 'Garantía' : 'Interno'; };
  const inFord = {}, noFord = [];
  Object.entries(V).forEach(([vin, v]) => {
    if (F.has(vin)) { const k = v.pays.has('C') ? 'Cargo cliente' : v.pays.has('W') ? 'Sólo garantía' : 'Sólo interno'; inFord[k] = (inFord[k] || 0) + 1; }
    else noFord.push({vin, pagos: [...v.pays].join(''), ops: [...v.ops].join(', '), motivo: v.rec === 'N' ? 'VIN no reconocido por Ford' : (!v.pays.has('C') && !v.pays.has('W') ? 'Sólo cargo interno' : (v.ops.has('PREE1') ? 'Pre-entrega (Dealer Prep)' : 'Otro'))});
  });
  const faltan = [...F].filter(x => !V[x]);
  return {total: F.size, enAgenda: f.enAgenda, inFord, noFord, faltan};
}

const getP = path => path.reduce((o, k) => o[k], S.obj);
const IN = (l, path, fmt = 'money', infl) => ({l, path, fmt, infl, t: 'sum'});
const RATIO_T = (l, num, den, fmt = 'money') => ({l, fmt, v: i => div(num(i), den(i)), tot: () => div(sum12(num), sum12(den))});
const CALC = (l, f, fmt = 'money') => ({l, fmt, v: f, tot: () => sum12(f)});
const sum12 = f => { let s = 0; for (let i = 0; i < 12; i++) s += nz(f(i)); return s; };
const pv = path => i => nz(getP(path)[i]);
function block(prefix, pasosF, unitPath, costPath, unitLbl, ventaLbl, pasosInput, pasosLbl = 'Objetivo Pasos') {
  const venta = i => pasosF(i) * pv(unitPath)(i);
  const costo = pv(costPath);
  return [
    pasosInput ? IN(pasosLbl, pasosInput, 'int') : CALC(pasosLbl, pasosF, 'int'),
    Object.assign(IN(unitLbl, unitPath, 'money', true), {tot: () => div(sum12(venta), sum12(pasosF))}),
    CALC(ventaLbl, venta),
    IN('Costo (AR$)', costPath, 'money', true),
    CALC('Margen Bruto (AR$)', i => venta(i) - costo(i)),
    RATIO_T('Ratio Margen Bruto %', i => venta(i) - costo(i), venta, 'pct')
  ];
}

  const ex = k => pv(['ext', k]);
  const eV = i => ex('mos')(i) + ex('may')(i) + ex('seg')(i), eC = i => ex('cMos')(i) + ex('cMay')(i) + ex('cSeg')(i);
  const EX = {
    title: 'Repuestos Externos', infl: ['ext', 'inflacion'], rows: [
      {sec: 'Ventas'}, IN('Mostrador', ['ext', 'mos'], 'money', true), IN('Mayoristas/Talleristas/Flotas', ['ext', 'may'], 'money', true), IN('Compañías de Seguro', ['ext', 'seg'], 'money', true), CALC('Total', eV),
      {sec: 'Costo de venta'}, IN('Mostrador', ['ext', 'cMos'], 'money', true), IN('Mayoristas/Talleristas/Flotas', ['ext', 'cMay'], 'money', true), IN('Compañías de Seguro', ['ext', 'cSeg'], 'money', true), CALC('Total', eC),
      {sec: 'Margen Bruto'}, CALC('Mostrador', i => ex('mos')(i) - ex('cMos')(i)), CALC('Mayoristas/Talleristas/Flotas', i => ex('may')(i) - ex('cMay')(i)), CALC('Compañías de Seguro', i => ex('seg')(i) - ex('cSeg')(i)), CALC('Total', i => eV(i) - eC(i)),
      {sec: 'Ratio Margen Bruto (%)'}, RATIO_T('Mostrador', i => ex('mos')(i) - ex('cMos')(i), ex('mos'), 'pct'), RATIO_T('Mayoristas/Talleristas/Flotas', i => ex('may')(i) - ex('cMay')(i), ex('may'), 'pct'), RATIO_T('Compañías de Seguro', i => ex('seg')(i) - ex('cSeg')(i), ex('seg'), 'pct'), RATIO_T('Total', i => eV(i) - eC(i), eV, 'pct')
    ]
  };
  const avgT = path => () => { const v = getP(path).filter(isNum); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const GE = {
    title: 'Info general & Accesorios', rows: [
      {sec: 'Objetivos de información general (PROYECCION filas 8-14)'},
      IN('Días laborales', ['gen', 'dias'], 'int'),
      Object.assign(IN('Cantidad de técnicos', ['gen', 'tecnicos'], 'dec'), {tot: () => nz(avgT(['gen', 'staffMant'])()) + nz(avgT(['gen', 'staffRep'])())}),
      Object.assign(IN('Staff Servicio Mantenimiento', ['gen', 'staffMant'], 'dec'), {tot: avgT(['gen', 'staffMant'])}),
      Object.assign(IN('Staff Reparaciones generales', ['gen', 'staffRep'], 'dec'), {tot: avgT(['gen', 'staffRep'])}),
      Object.assign(IN('Cantidad de áreas de trabajo', ['gen', 'areas'], 'dec'), {tot: () => nz(avgT(['gen', 'areasMant'])()) + nz(avgT(['gen', 'areasRep'])())}),
      Object.assign(IN('Áreas Servicios Mantenimiento', ['gen', 'areasMant'], 'dec'), {tot: avgT(['gen', 'areasMant'])}),
      Object.assign(IN('Áreas Reparaciones', ['gen', 'areasRep'], 'dec'), {tot: avgT(['gen', 'areasRep'])}),
      {sec: 'Accesorios (el objetivo de pasos = Venta 0km real ÷ factor)'},
      IN('Venta MO Accesorios', ['acc', 'moVenta']), IN('Costo MO Accesorios', ['acc', 'moCosto']),
      IN('Venta Repuestos Accesorios', ['acc', 'repVenta']), IN('Costo Repuestos Accesorios', ['acc', 'repCosto'])
    ]
  };
  return {sr: SR, cyp: CP, gar: GA, ext: EX, gen: GE};
}

const PASO_ROWS = [...SM_LABELS, 'RG', 'CYP', 'GAR'];
const PASO_LBL = {RG: 'Reparación General', CYP: 'Chapa & Pintura', GAR: 'Garantía'};
function pasosCell(view, m, grp, lab) {
  // devuelve {y25, y26, p26, auto}
  const H = S.pasosHist[view];
  const g = (o) => o && o[String(m)] && o[String(m)][grp] ? o[String(m)][grp][lab] : null;
  const out = {y25: g(H.y2025) ?? null, y26: null, p26: null, auto: false};
  const r = S.ro[m];
  if (r && r.agg) {
    const a = r.agg;
    const src = SM_LABELS.includes(lab) ? a.sm[grp][lab] : a.cat2[grp][lab];
    out.y26 = view === 'mo' ? src.mo : src.rep; out.p26 = src.pasos; out.auto = true;
  } else { out.y26 = g(H.y2026); out.p26 = g(H.p2026); }
  return out;
}
function setPasosHist(view, key, m, grp, lab, v) {
  const H = S.pasosHist[view];
  H[key][m] = H[key][m] || {}; H[key][m][grp] = H[key][m][grp] || {};
  if (v === null) delete H[key][m][grp][lab]; else H[key][m][grp][lab] = v;
}
function renderPasos() {
  if (UI.pasosModo !== 'mes') return renderPasosAnual();
  if (!UI.pasosMes) UI.pasosMes = lastMonthWithData();
  const m = UI.pasosMes, view = UI.pasosView;
  let h = `<div class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${view === 'mo' ? 'Pasos & Mano de Obra' : 'Pasos & Repuestos internos'}</h2>
    <div class="small muted">Vendidos por concesionario (VIN en la lista de unidades vendidas) vs. vehículos visitantes. ${S.ro[m] ? '<span class="pill auto">' + MESES[m - 1] + ' calculado desde OR</span>' : '<span class="pill">' + MESES[m - 1] + ' sin OR importadas: valores cargados a mano</span>'}</div></div>
    <div class="row"><div class="subtabs" style="margin:0"><button data-pv="mo" class="${view === 'mo' ? 'on' : ''}">Mano de obra</button><button data-pv="rep" class="${view === 'rep' ? 'on' : ''}">Repuestos</button></div><div class="subtabs" style="margin:0"><button data-pm="anual">Mes a mes</button><button data-pm="mes" class="on">Un mes + acumulado</button></div>${monthSelect('selPasosMes', m)}</div></div>
    <p class="small muted" style="margin:8px 0 0">En esta vista podés corregir a mano los meses sin OR importadas y la columna ${S.meta.anio - 1}.</p></div>`;
  h += `<div class="tw"><table class="t" id="tblPasos"><thead><tr><th class="lbl" rowspan="2" style="min-width:150px">Categoría</th><th rowspan="2" style="text-align:left">Tipo de servicio</th><th colspan="5" class="sepL">${MESES[m - 1]}</th><th colspan="5" class="sepL">Acumulado Ene–${MES3[m - 1]}</th></tr>
   <tr><th class="sepL">${S.meta.anio - 1} Resultado</th><th>${S.meta.anio} Resultado</th><th>Pasos</th><th>GAP vs ${S.meta.anio - 1}</th><th>Venta / Pasos</th><th class="sepL">${S.meta.anio - 1}</th><th>${S.meta.anio}</th><th>Pasos</th><th>GAP</th><th>Venta / Pasos</th></tr></thead><tbody>`;
  const accum = (grp, lab) => { let a = 0, b = 0, p = 0; for (let k = 1; k <= m; k++) { const c = pasosCell(view, k, grp, lab); a += nz(c.y25); b += nz(c.y26); p += nz(c.p26); } return {y25: a, y26: b, p26: p}; };
  const line = (lab, c, ac, editable, grp, cls = '') => {
    const inp = (key, v, sc = '') => editable ? `<td class="in ${sc}"><input data-key="${key}" data-grp="${grp}" data-lab="${lab}" value="${fmtInput('money', v)}"></td>` : `<td class="${sc}">${fmtMoney(v)}</td>`;
    return `<tr class="${cls}"><td class="lbl"></td><td style="text-align:left">${PASO_LBL[lab] || lab}</td>${inp('y2025', c.y25, 'sepL')}${c.auto || !editable ? `<td>${fmtMoney(c.y26)}</td>` : inp('y2026', c.y26)}${c.auto || !editable ? `<td>${fmtInt(c.p26)}</td>` : `<td class="in"><input data-key="p2026" data-grp="${grp}" data-lab="${lab}" value="${fmtInput('int', c.p26)}"></td>`}
      <td class="${gapClass(nz(c.y26) - nz(c.y25))}">${fmtMoney(nz(c.y26) - nz(c.y25))}</td><td>${fmtMoney(div(c.y26, c.p26))}</td>
      <td class="sepL tot">${fmtMoney(ac.y25)}</td><td class="tot">${fmtMoney(ac.y26)}</td><td class="tot">${fmtInt(ac.p26)}</td><td class="tot ${gapClass(ac.y26 - ac.y25)}">${fmtMoney(ac.y26 - ac.y25)}</td><td class="tot">${fmtMoney(div(ac.y26, ac.p26))}</td></tr>`;
  };
  const sumC = list => list.reduce((a, c) => ({y25: nz(a.y25) + nz(c.y25), y26: nz(a.y26) + nz(c.y26), p26: nz(a.p26) + nz(c.p26)}), {y25: 0, y26: 0, p26: 0});
  const blockRows = (title, grps) => {
    let s = `<tr class="sec"><td class="lbl">${title}</td><td colspan="11"></td></tr>`;
    const cellsOf = lab => grps.length === 1 ? pasosCell(view, m, grps[0], lab) : sumC(grps.map(g => pasosCell(view, m, g, lab)));
    const accOf = lab => grps.length === 1 ? accum(grps[0], lab) : sumC(grps.map(g => accum(g, lab)));
    SM_LABELS.forEach(l => s += line(l, cellsOf(l), accOf(l), grps.length === 1, grps[0]));
    const smC = sumC(SM_LABELS.map(cellsOf)), smA = sumC(SM_LABELS.map(accOf));
    s += line('Subtotal SM', smC, smA, false, '', 'strong');
    ['RG', 'CYP', 'GAR'].forEach(l => s += line(l, cellsOf(l), accOf(l), grps.length === 1, grps[0]));
    const tC = sumC([smC, cellsOf('RG'), cellsOf('CYP')]), tA = sumC([smA, accOf('RG'), accOf('CYP')]);
    s += line('Total (SM + RG + C&P)', tC, tA, false, '', 'strong hl');
    return s;
  };
  h += blockRows('Vendidos por concesionario (0KM)', ['own']) + blockRows('Vehículos visitantes', ['vis']) + blockRows('TOTAL', ['own', 'vis']);
  h += `</tbody></table></div><p class="small muted">Igual que la hoja original, el “Total” suma SM + Reparación General + Chapa & Pintura (Garantía se muestra aparte). Columnas ${S.meta.anio - 1} editables.</p>`;
  $('#tab-pasos').innerHTML = h;
  $$('#tab-pasos [data-pv]').forEach(b => b.onclick = () => { UI.pasosView = b.dataset.pv; renderPasos(); });
  $$('#tab-pasos [data-pm]').forEach(b => b.onclick = () => { UI.pasosModo = b.dataset.pm; renderPasos(); });
  $('#selPasosMes').onchange = e => { UI.pasosMes = +e.target.value; renderPasos(); };
  $$('#tblPasos input').forEach(inp => inp.onchange = () => {
    setPasosHist(view, inp.dataset.key, String(m), inp.dataset.grp, inp.dataset.lab, parseNum(inp.value));
    saveState(); renderPasos();
  });
}

      const f = inp.files[0]; if (!f) return;

        reaggregateAll(); UI.mesReporte = null; UI.pasosMes = null;

    if (!(await askConfirm('Se borran todas las cargas e importaciones y se vuelve a los datos del Excel original. ¿Continuar?'))) return;

async function downloadBlob(blob, name) {
  // dentro de claude.ai las descargas pasan por la capacidad "downloads"
  if (window.claude && window.claude.use) {
    try {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({filename: name, data: blob}); alertMsg('Archivo listo: ' + name); return; }
    } catch (e) {
      if (e && e.code === 'declined') return;
      alertMsg('No se pudo descargar: ' + (e && e.message || e)); return;
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function askConfirm(msg) {
  return new Promise(res => {
    const w = document.createElement('div');
    w.className = 'modal-bg';
    w.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mdNo">Cancelar</button><button class="btn primary" id="mdSi">Aceptar</button></div></div>`;
    document.body.appendChild(w);
    const done = v => { w.remove(); res(v); };
    w.querySelector('#mdNo').onclick = () => done(false);
    w.querySelector('#mdSi').onclick = () => done(true);
    w.querySelector('#mdSi').focus();
  });
}

function gudbDesc(code) {
  if (typeof GUDB === 'undefined') return '';
  const c = String(code || '').toUpperCase().trim(), g = GUDB[c];
  return g ? g[0] + (g[1] ? ' · ' + g[1] : '') : '';
}

function renderPasosAnual() {
  const view = UI.pasosView, y0 = S.meta.anio - 1, y1 = S.meta.anio;
  const cols = UI.pasosCols || 'full';   // full = 5 columnas por mes, corto = 2026 + pasos
  let h = `<div class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${view === 'mo' ? 'Pasos & Mano de Obra' : 'Pasos & Repuestos internos'} — mes a mes</h2>
    <div class="small muted">● = mes calculado desde las OR importadas; el resto son los valores cargados a mano. Para corregir un mes usá “Un mes + acumulado”.</div></div>
    <div class="row"><div class="subtabs" style="margin:0"><button data-pv="mo" class="${view === 'mo' ? 'on' : ''}">Mano de obra</button><button data-pv="rep" class="${view === 'rep' ? 'on' : ''}">Repuestos</button></div>

  const per = cols === 'full' ? 5 : 2;
  h += `<div class="tw"><table class="t" id="tblPasosA"><thead><tr><th class="lbl" rowspan="2" style="min-width:170px">Tipo de servicio</th>`;
  for (let m = 1; m <= 12; m++) h += `<th colspan="${per}" class="sepL">${MESES[m - 1]}${S.ro[m] ? ' ●' : ''}</th>`;
  h += `<th colspan="5" class="sepL">TOTAL</th></tr><tr>`;
  for (let m = 1; m <= 12; m++) h += cols === 'full' ? `<th class="sepL">${y0}</th><th>${y1}</th><th>Pasos</th><th>GAP vs ${y0}</th><th>Venta/Paso</th>` : `<th class="sepL">${y1}</th><th>Pasos</th>`;
  h += `<th class="sepL">${y0}</th><th>${y1}</th><th>Pasos</th><th>${y1} vs ${y0}</th><th>Ratio</th></tr></thead><tbody>`;
  const sumC = list => list.reduce((a, c) => ({y25: nz(a.y25) + nz(c.y25), y26: nz(a.y26) + nz(c.y26), p26: nz(a.p26) + nz(c.p26)}), {y25: 0, y26: 0, p26: 0});
  const cellOf = (grps, lab, m) => {
    if (lab === 'SUB') return sumC(SM_LABELS.map(l => cellOf(grps, l, m)));
    if (lab === 'TOT') return sumC(['SUB', 'RG', 'CYP'].map(l => cellOf(grps, l, m)));
    return sumC(grps.map(g => pasosCell(view, m, g, lab)));
  };
  const line = (grps, lab, txt, cls = '') => {
    let r = `<tr class="${cls}"><td class="lbl">${txt}</td>`, T = {y25: 0, y26: 0, p26: 0};
    for (let m = 1; m <= 12; m++) {
      const c = cellOf(grps, lab, m); T = sumC([T, c]);
      const has = c.y26 || c.p26;
      if (cols === 'full') r += `<td class="sepL o">${c.y25 ? fmtMoney(c.y25) : ''}</td><td>${has ? fmtMoney(c.y26) : ''}</td><td>${has ? fmtInt(c.p26) : ''}</td><td class="${has ? gapClass(c.y26 - c.y25) : ''}">${has ? fmtMoney(c.y26 - c.y25) : ''}</td><td>${has ? fmtMoney(div(c.y26, c.p26)) : ''}</td>`;
      else r += `<td class="sepL">${has ? fmtMoney(c.y26) : ''}</td><td>${has ? fmtInt(c.p26) : ''}</td>`;
    }
    r += `<td class="sepL tot">${fmtMoney(T.y25)}</td><td class="tot">${fmtMoney(T.y26)}</td><td class="tot">${fmtInt(T.p26)}</td><td class="tot ${gapClass(T.y26 - T.y25)}">${fmtMoney(T.y26 - T.y25)}</td><td class="tot">${T.y25 ? fmtDec(T.y26 / T.y25, 2) : ''}</td></tr>`;
    return r;
  };
  const block = (title, grps) => {
    let r = `<tr class="sec"><td class="lbl">${title}</td><td colspan="${12 * per + 5}"></td></tr>`;
    SM_LABELS.forEach(l => r += line(grps, l, l));
    r += line(grps, 'SUB', 'Subtotal SM', 'strong');
    r += line(grps, 'RG', 'Reparación General') + line(grps, 'CYP', 'Chapa & Pintura') + line(grps, 'GAR', 'Garantía');
    r += line(grps, 'TOT', 'Total (SM + RG + C&P)', 'strong hl');
    return r;
  };
  h += block('Vendidos por concesionario (0KM)', ['own']) + block('Vehículos visitantes', ['vis']) + block('TOTAL', ['own', 'vis']);
  h += '</tbody></table></div>';
  $('#tab-pasos').innerHTML = h;
  $$('#tab-pasos [data-pv]').forEach(b => b.onclick = () => { UI.pasosView = b.dataset.pv; renderPasos(); });
  $$('#tab-pasos [data-pm]').forEach(b => b.onclick = () => { UI.pasosModo = b.dataset.pm; renderPasos(); });
  $('#chkCorto').onchange = e => { UI.pasosCols = e.target.checked ? 'corto' : 'full'; renderPasos(); };
}

];
const KPI_CARDS = [['pasosMant', 'Pasos Mantenimiento', 'int'], ['pasosRep', 'Pasos Reparaciones', 'int'], ['pasosGar', 'Pasos Garantía', 'int'], ['moTot', 'Venta Mano de Obra', 'money'],
  ['repTot', 'Repuestos internos', 'money'], ['extTot', 'Repuestos externos', 'money'], ['fact', 'Facturación total', 'money'], ['mbTot', 'Margen bruto total', 'money']];

function cumpl(o, r, fmt, inv) {
  if (!isNum(o) || !isNum(r)) return null;
  if (fmt === 'pct') return {pp: (r - o) * 100, ok: inv ? r <= o : r >= o};
  if (o === 0) return null;
  return {pct: r / o, ok: inv ? r <= o : r >= o};
}
function statusOf(c, inv) {
  if (!c) return 'na';
  if (c.pp !== undefined) return c.ok ? 'good' : (Math.abs(c.pp) <= 2 ? 'warn' : 'bad');
  const p = inv ? 2 - c.pct : c.pct;
  return p >= 1 ? 'good' : p >= 0.9 ? 'warn' : 'bad';
}
const STATUS_TXT = {good: '▲ En objetivo', warn: '● Cerca', bad: '▼ Bajo objetivo', na: 'Sin dato'};
function cumplTxt(c) { if (!c) return '—'; return c.pp !== undefined ? (c.pp >= 0 ? '+' : '') + fmtDec(c.pp, 1) + ' p.p.' : fmtPct(c.pct, 0); }

function reportData(m) {
  const M = buildModel(m);
  const o = M.obj[m - 1], r = M.res[m - 1], oy = M.objY, ry = M.resY;
  const rows = REPORT_ROWS.map(x => {
    if (x[0] === 'sec') return {sec: x[1]};
    const [k, l, fmt, inv, strong] = x;
    const ro = r._empty ? null : r[k], ryv = ry._empty ? null : ry[k];
    return {k, l, fmt, inv: !!inv, strong: !!strong, o: o[k], r: ro, g: isNum(ro) && isNum(o[k]) ? ro - o[k] : null, c: cumpl(o[k], ro, fmt, inv),
      oy: oy[k], ry: ryv, gy: isNum(ryv) && isNum(oy[k]) ? ryv - oy[k] : null, cy: cumpl(oy[k], ryv, fmt, inv)};
  });
  // faltantes de carga
  const b = M.rb[m - 1], falt = [];
  const need = [['costoMoTaller', 'Costo MO Taller'], ['repTaller', 'Venta repuestos Taller'], ['costoRepTaller', 'Costo repuestos Taller'], ['extMos', 'Ventas por Mostrador'], ['cExtMos', 'Costo Mostrador'], ['dias', 'Días laborales'], ['staffMant', 'Staff mantenimiento']];
  need.forEach(([k, l]) => { if (!isNum(b[k])) falt.push(l); });
  const best = rows.filter(x => x.c && x.fmt !== 'pct' && ['int', 'money'].includes(x.fmt) && x.c.pct !== undefined).sort((a, b2) => (b2.c.pct - a.c.pct));
  return {M, rows, falt, best, m, hasRO: !!S.ro[m]};
}

  D.rows.forEach(x => {
    if (x.sec) { h += `<tr class="sec"><td class="lbl">${x.sec}</td><td colspan="10"></td></tr>`; return; }
    const s1 = statusOf(x.c, x.inv), s2 = statusOf(x.cy, x.inv);

      <td class="o sepL">${fmtBy(x.fmt, x.oy)}</td><td>${fmtBy(x.fmt, x.ry)}</td><td class="${gapClass(x.gy, x.inv)}">${fmtBy(x.fmt, x.gy)}</td><td>${cumplTxt(x.cy)}</td><td style="text-align:left"><span class="pill ${s2}">${STATUS_TXT[s2]}</span></td></tr>`;
  });
  h += '</tbody></table></div></div>';
  // mix SM del mes
  if (D.hasRO) {
    const a = S.ro[m].agg;
    const tot = SM_LABELS.reduce((s, l) => s + a.sm.own[l].pasos + a.sm.vis[l].pasos, 0);
    const own = SM_LABELS.reduce((s, l) => s + a.sm.own[l].pasos, 0);

  } else {
    h += `<div class="chartbox"><h3>Facturación total por mes</h3><p>Resultado (barras) vs. objetivo (línea), ${S.meta.anio}.</p><div class="cv"><canvas id="chRepFact"></canvas></div></div>`;
  }
  $('#tab-resumen').innerHTML = h;
  $('#selMesRep').onchange = e => { UI.mesReporte = +e.target.value; renderResumen(); };
  if (window.claude) $('#btnRepPrint').hidden = true; else $('#btnRepPrint').onclick = () => window.print();

  makeChart('chRepFact', chartObjRes(M, 'fact', 'Facturación', true));

}

const moneyTick = v => fmtCompact(v).replace('$ ', '$');
function baseOpts(kind) {

    plugins: {legend: {position: 'top', align: 'start'}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${kind === 'money' ? fmtMoney(c.parsed.y) : kind === 'pct' ? fmtPct(c.parsed.y) : fmtBy('dec', c.parsed.y)}`}}},
    scales: {x: {grid: {display: false}, stacked: false}, y: {beginAtZero: true, grid: {color: GRID}, border: {display: false}, ticks: {callback: v => kind === 'money' ? moneyTick(v) : kind === 'pct' ? fmtPct(v, 0) : v}}}

}
function barDS(label, data, color, stack) { return {type: 'bar', label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'bottom', borderColor: cssVar('--surface') || '#fff', borderWidth: stack ? {top: 2} : 0, stack, maxBarThickness: 34, order: 2}; }
function lineDS(label, data, color, dash) { return {type: 'line', label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, borderDash: dash ? [6, 4] : [], tension: 0, order: 1, spanGaps: false}; }

const AVG_ROWS = [10, 11, 13, 14];

function sheetProyeccion(wb, M) {
  const ws = wb.addWorksheet('PROYECCION - Cuantitativos', {views: [{state: 'frozen', xSplit: 4, ySplit: 6, showGridLines: false}]});
  ws.getColumn(1).width = 2.4; ws.getColumn(2).width = 3.1; ws.getColumn(3).width = 26.9; ws.getColumn(4).width = 29.9;
  for (let c = 5; c <= 45; c++) ws.getColumn(c).width = 13;
  setC(ws, 'A1', `Análisis Gestión Posventa ${S.meta.anio}`, {b: true, sz: 12, border: false});
  setC(ws, 'C2', 'Concesionario:', {b: true, sz: 9, h: 'right', border: false}); setC(ws, 'D2', S.meta.concesionario, {b: true, sz: 9, border: false});
  setC(ws, 'E2', 'ZONA', {b: true, sz: 9, border: false}); setC(ws, 'F2', S.meta.zona, {b: true, sz: 9, border: false});
  hdr(ws, 'D4', `Año ${S.meta.anio}`);
  hdr(ws, 'B5', 'Items', 'B5:C6'); hdr(ws, 'D5', 'Detalle', 'D5:D6');
  for (let m = 1; m <= 12; m++) {
    const c0 = 5 + 3 * (m - 1), L = colL(c0);
    hdr(ws, L + '4', MESES[m - 1], `${L}4:${colL(c0 + 2)}4`);
    hdr(ws, L + '5', 'Objetivo'); hdr(ws, colL(c0 + 1) + '5', 'Resultado'); hdr(ws, colL(c0 + 2) + '5', 'GAP');
    hdr(ws, L + '6', ''); hdr(ws, colL(c0 + 1) + '6', ''); hdr(ws, colL(c0 + 2) + '6', 'vs Obj');
  }
  hdr(ws, 'AO4', 'Total', 'AO4:AS4');
  [['AO', 'Objetivo', ''], ['AP', `Resultado ${S.meta.anio - 1}`, ''], ['AQ', 'Resultado', ''], ['AR', 'GAP', 'vs Obj'], ['AS', 'GAP', 'vs LY']].forEach(([c, a, b]) => { hdr(ws, c + '5', a); hdr(ws, c + '6', b); });
  const fac = S.obj.accFactor || 1.2;
  const z = v => isNum(v) ? v : 0;
  const sumOf = (r, off, fn) => `${fn}(${Array.from({length: 12}, (_, i) => colL(5 + 3 * i + off) + r).join(',')})`;
  for (const R of PROY_ROWS) {
    const row = R[0];
    if (R[1] === 'sec') { setC(ws, 'B' + row, R[2], {b: true, border: false}); continue; }
    const [, , grp, lab, key, fmt, , strong] = R;
    const hl = row >= 97 ? HL_FILL : null;
    if (grp) setC(ws, 'C' + row, grp, {fill: hl, b: !!strong});
    setC(ws, 'D' + row, lab, {fill: hl, b: !!strong});
    const isDer = !!PROY_F[row];
    const sty = {nf: fmt === 'dec' && row <= 14 ? 'dec' : fmt, b: !!strong, fill: hl};
    for (let m = 1; m <= 12; m++) {
      const c0 = 5 + 3 * (m - 1), E = colL(c0), F = colL(c0 + 1), G = colL(c0 + 2);
      const o = M.obj[m - 1][key];
      // objetivo
      if (isDer) setC(ws, E + row, z(o), Object.assign({f: PROY_F[row].replace(/\{c\}/g, E)}, sty));
      else if (PROY_OBJ_F[row]) setC(ws, E + row, z(o), Object.assign({f: PROY_OBJ_F[row].replace(/\{p\}/g, colL(6 + m - 1)).replace(/\{g\}/g, colL(5 + m - 1)).replace(/\{c\}/g, E).replace(/\{r\}/g, F).replace('{fac}', fac)}, sty));
      else setC(ws, E + row, o, sty);
      // resultado
      const emp = M.res[m - 1]._empty;
      if (emp) { setC(ws, F + row, null, sty); setC(ws, G + row, null, sty); continue; }
      const r = M.res[m - 1][key];
      if (isDer) setC(ws, F + row, z(r), Object.assign({f: PROY_F[row].replace(/\{c\}/g, F)}, sty));
      else setC(ws, F + row, isNum(r) ? r : null, sty);
      setC(ws, G + row, z(r) - z(o), Object.assign({f: `IFERROR(${F}${row}-${E}${row},0)`}, sty));
    }
    // totales
    const oT = M.objT[key], rT = M.resT._empty ? null : M.resT[key], ly = M.ly ? M.ly[key] : null;
    const tot = (col, off, val) => {
      if (isDer) return setC(ws, col + row, z(val), Object.assign({f: PROY_F[row].replace(/\{c\}/g, col)}, sty));
      if (row === 9) return setC(ws, col + row, z(val), Object.assign({f: `IFERROR(SUM(${col}10:${col}11),0)`}, sty));
      if (row === 12) return setC(ws, col + row, z(val), Object.assign({f: `IFERROR(SUM(${col}13:${col}14),0)`}, sty));
      if (AVG_ROWS.includes(row)) return setC(ws, col + row, z(val), Object.assign({f: `IFERROR(${sumOf(row, off, 'AVERAGE')},0)`}, sty));
      return setC(ws, col + row, z(val), Object.assign({f: sumOf(row, off, 'SUM')}, sty));
    };
    tot('AO', 0, oT); tot('AQ', 1, rT);
    if (isDer && M.ly) setC(ws, 'AP' + row, ly, Object.assign({f: PROY_F[row].replace(/\{c\}/g, 'AP')}, sty));
    else setC(ws, 'AP' + row, isNum(ly) ? ly : null, sty);
    setC(ws, 'AR' + row, z(rT) - z(oT), Object.assign({f: `IFERROR(AQ${row}-AO${row},0)`}, sty));
    setC(ws, 'AS' + row, isNum(rT) && isNum(ly) ? rT - ly : null, M.ly ? Object.assign({f: `IFERROR(AQ${row}-AP${row},0)`}, sty) : sty);
  }
  ws.pageSetup = {orientation: 'landscape', paperSize: 8, fitToPage: true, fitToWidth: 1, fitToHeight: 0};
}

/* ---------- hojas de proyección (mes en columnas) ---------- */
function projSheet(wb, name, title, c0, spec, inflRow, inflArr) {
  // c0 = número de la primera columna de meses (6 = F, 5 = E)
  const ws = wb.addWorksheet(name, {views: [{state: 'frozen', xSplit: c0 - 1, ySplit: 4, showGridLines: false}]});
  for (let c = 1; c < c0; c++) ws.getColumn(c).width = c === c0 - 1 ? 24 : 18;
  for (let c = c0; c < c0 + 13; c++) ws.getColumn(c).width = 14;
  setC(ws, 'A1', title, {b: true, sz: 12, border: false});
  const T = colL(c0 + 12);
  const hr = inflRow + 1;
  setC(ws, colL(c0 - 2) + inflRow, 'Fecha', {b: true, border: false}); setC(ws, colL(c0 - 1) + inflRow, 'Índice Inflación', {b: true, border: false});
  hdr(ws, colL(c0 - 1) + hr, 'Mes');
  for (let i = 0; i < 12; i++) {
    setC(ws, colL(c0 + i) + inflRow, isNum(inflArr[i]) ? inflArr[i] : 0, {nf: '0.0%'});
    hdr(ws, colL(c0 + i) + hr, MES3[i]);
  }
  hdr(ws, T + hr, 'TOTAL');
  for (const s of spec) {
    const r = s.r;
    Object.entries(s.lab || {}).forEach(([col, v]) => setC(ws, col + r, v, {b: !!s.b, fill: s.sec ? SEC_FILL : null}));
    if (s.sec) continue;
    for (let i = 0; i < 12; i++) {
      const L = colL(c0 + i);
      const val = s.v ? s.v(i) : (s.arr ? s.arr[i] : null);
      if (s.f) setC(ws, L + r, val, {f: s.f.replace(/\{c\}/g, L).replace(/\{p\}/g, colL(c0 + i - 1)), nf: s.nf, fill: CALC_FILL});
      else setC(ws, L + r, isNum(val) ? val : null, {nf: s.nf, fill: IN_FILL});
    }
    if (s.tf !== null) setC(ws, T + r, s.tv, {f: (s.tf || `SUM(${colL(c0)}{r}:${colL(c0 + 11)}{r})`).replace(/\{r\}/g, r).replace(/\{c\}/g, T), nf: s.nf, b: true, fill: CALC_FILL});
  }
  return ws;
}
const sumA = f => { let s = 0; for (let i = 0; i < 12; i++) s += nz(f(i)); return s; };
function specBlock(r0, pasos, unit, cost, labs, opts = {}) {

  const venta = i => nz(pasos.v(i)) * nz(unit[i]);
  const mb = i => venta(i) - nz(cost[i]);
  return [
    Object.assign({r: r0, lab: Object.assign({}, labs.top || {}, {[labs.col]: labs.p || 'Objetivo Pasos'}), nf: 'int', v: pasos.v, tv: sumA(pasos.v)}, pasos.f ? {f: pasos.f} : {}),
    {r: r0 + 1, lab: {[labs.col]: labs.u}, nf: 'money', arr: unit, tf: `IFERROR({c}${r0 + 2}/{c}${r0},"")`, tv: div(sumA(venta), sumA(pasos.v))},
    {r: r0 + 2, lab: {[labs.col]: labs.vta}, nf: 'money', v: venta, f: `{c}${r0 + 1}*{c}${r0}`, tv: sumA(venta)},
    {r: r0 + 3, lab: {[labs.col]: 'Costo (AR$)'}, nf: 'money', arr: cost, tv: sumA(i => cost[i])},
    {r: r0 + 4, lab: {[labs.col]: 'Margen Bruto (AR$)'}, nf: 'money', v: mb, f: `{c}${r0 + 2}-{c}${r0 + 3}`, tv: sumA(mb)},
    {r: r0 + 5, lab: {[labs.col]: 'Ratio Margen Bruto %'}, nf: 'pct', v: i => div(mb(i), venta(i)), f: `IFERROR({c}${r0 + 4}/{c}${r0 + 2},"")`, tf: `IFERROR({c}${r0 + 4}/{c}${r0 + 2},"")`, tv: div(sumA(mb), sumA(venta))}
  ];
}
function totBlock(r0, col, parts, labP, labU, labV) {

  const P = i => parts.reduce((a, p) => a + nz(p.pasosV(i)), 0), V = i => parts.reduce((a, p) => a + nz(p.ventaV(i)), 0), C = i => parts.reduce((a, p) => a + nz(p.costoV(i)), 0);

/* ============================================================
   Guardado en la nube (versión online en claude.ai, capacidad "db")
   - plan/core      : todo el estado salvo las líneas de OR
   - ro/m{mes}_{n}  : líneas de OR del mes, en trozos
   - vins/c{n}      : lista de VIN de unidades vendidas, en trozos
   Fuera de claude.ai (archivo local) no hace nada: queda el guardado del navegador.
   ============================================================ */
const CLOUD = {db: null, on: false, readOnly: false, sig: {ro: {}, vins: ''}, coreStr: '', rev: '', queue: Promise.resolve(), timer: null, applying: false};
const CHUNK_BYTES = 180000;

function cloudSetStatus(t, warn) {
  const el = document.getElementById('cloudStatus');
  if (el) { el.textContent = t; el.style.color = warn ? '#ffd27a' : ''; }
}
function roSig(r) { return r && r.lines ? `${r.file}|${r.fecha}|${r.lines.length}|${r.lines.reduce((a, l) => a + (l[6] || 0) + (l[5] || 0), 0).toFixed(2)}` : ''; }
function vinSig() { return VINS.size + '|' + (S.vinInfo ? S.vinInfo.file + S.vinInfo.fecha : ''); }
function chunkArr(arr) {
  const out = []; let cur = [], size = 2;
  for (const x of arr) {
    const n = JSON.stringify(x).length + 1;
    if (size + n > CHUNK_BYTES && cur.length) { out.push(cur); cur = []; size = 2; }
    cur.push(x); size += n;
  }
  if (cur.length || !out.length) out.push(cur);
  return out;
}
function packCore() {
  const st = Object.assign({}, S, {ro: {}});
  Object.entries(S.ro).forEach(([m, r]) => { st.ro[m] = {file: r.file, fecha: r.fecha, periodo: r.periodo}; });
  return st;
}
const enqueue = fn => (CLOUD.queue = CLOUD.queue.then(fn).catch(e => { handleCloudError(e); }));
function handleCloudError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' && JSON.stringify(packCore()).length > 250000) { cloudSetStatus('⚠ Datos demasiado grandes', true); alertMsg('No se pudo guardar en la nube: el plan supera el tamaño permitido.'); return; }
  if (code === 'invalid_argument' || code === 'not_granted') { CLOUD.readOnly = true; cloudSetStatus('Sólo lectura: tu acceso no permite guardar', true); return; }
  if (code === 'quota_exceeded') { cloudSetStatus('⚠ Nube llena', true); alertMsg('No se pudo guardar en la nube: se llenó el espacio. Eliminá importaciones de OR viejas.'); return; }
  cloudSetStatus('⚠ Sin guardar en la nube', true);
  console.error('nube', e);
}
async function retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); return fn(); } throw e; } }

async function cloudReadRO(m, n) {
  let lines = [];
  for (let i = 0; i < n; i++) {
    const s = await retry(() => CLOUD.db.doc(`ro/m${m}_${i}`).get());
    if (s.exists) lines = lines.concat(s.data().lines || []);
  }
  return lines;
}
async function cloudReadVins(n) {
  const set = new Set();
  for (let i = 0; i < n; i++) {
    const s = await retry(() => CLOUD.db.doc(`vins/c${i}`).get());
    if (s.exists) String(s.data().v || '').split(',').forEach(v => v && set.add(v));
  }
  return set;
}
// aplica un documento core leído de la nube
async function cloudApply(data) {
  CLOUD.applying = true;
  try {
    const st = data.state;
    const prev = S;
    for (const [m, idx] of Object.entries(data.roIndex || {})) {
      const r = st.ro[m]; if (!r) continue;
      if (prev && prev.ro && prev.ro[m] && CLOUD.sig.ro[m] === idx.sig && prev.ro[m].lines) r.lines = prev.ro[m].lines;
      else r.lines = await cloudReadRO(m, idx.n);
      CLOUD.sig.ro[m] = idx.sig; (CLOUD.sig.roN = CLOUD.sig.roN || {})[m] = idx.n;
    }
    if (data.vinsIndex && data.vinsIndex.sig !== CLOUD.sig.vins) {
      VINS = await cloudReadVins(data.vinsIndex.n);
      CLOUD.sig.vins = data.vinsIndex.sig;
      try { localStorage.setItem(VIN_KEY, [...VINS].join(',')); } catch (e) {}
    }
    S = st;
    S.turnos = S.turnos || {};
    reaggregateAll();
    if (!UI.mesReporte || !hasResults(UI.mesReporte)) UI.mesReporte = null;
    CLOUD.rev = data.rev;
    CLOUD.coreStr = JSON.stringify(packCore());
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
    refreshHeader();
    if (RENDER[currentTab]) RENDER[currentTab]();
  } finally { CLOUD.applying = false; }
}
async function cloudInit() {
  if (!window.claude || !window.claude.use) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { cloudSetStatus('Guardado sólo en este navegador'); return; }
  CLOUD.db = db; CLOUD.on = true;
  try {
    const user = await window.claude.use('user');
    if (user && user.can) { const w = await user.can('data.write'); if (w === false) CLOUD.readOnly = true; }
  } catch (e) {}
  cloudSetStatus('Conectando…');
  try {
    const snap = await retry(() => db.doc('plan/core').get());
    if (snap.exists) {
      await cloudApply(snap.data());
      cloudSetStatus(CLOUD.readOnly ? 'Sólo lectura' : '☁ Guardado en la nube');
    } else {
      cloudSetStatus(CLOUD.readOnly ? 'Sólo lectura' : '☁ Nube vacía: se guarda al primer cambio');
    }
  } catch (e) { handleCloudError(e); }
  // cambios hechos desde otra PC o pestaña
  db.doc('plan/core').onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const d = s.data();
    if (!d || d.rev === CLOUD.rev) return;
    CLOUD.rev = d.rev;
    enqueue(async () => { await cloudApply(d); alertMsg('Se actualizaron los datos con cambios hechos en otra sesión.'); });
  }, e => console.warn('nube (escucha)', e));
}
// se llama desde saveState()
function cloudSchedule() {
  if (!CLOUD.on || CLOUD.readOnly || CLOUD.applying) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(() => enqueue(cloudPush), 1200);
}
async function cloudPush() {
  const db = CLOUD.db;
  cloudSetStatus('Guardando en la nube…');
  const roIndex = {};
  // 1) líneas de OR que cambiaron
  for (const [m, r] of Object.entries(S.ro)) {
    const sig = roSig(r);
    const chunks = chunkArr(r.lines || []);
    roIndex[m] = {sig, n: chunks.length};
    if (CLOUD.sig.ro[m] === sig && CLOUD.sig.roN && CLOUD.sig.roN[m] === chunks.length) continue;
    for (let i = 0; i < chunks.length; i++) await retry(() => db.doc(`ro/m${m}_${i}`).set({mes: +m, parte: i, lines: chunks[i]}));
    const oldN = (CLOUD.sig.roN && CLOUD.sig.roN[m]) || 0;
    for (let i = chunks.length; i < oldN; i++) await retry(() => db.doc(`ro/m${m}_${i}`).delete());
    CLOUD.sig.ro[m] = sig; (CLOUD.sig.roN = CLOUD.sig.roN || {})[m] = chunks.length;
  }
  // meses eliminados
  for (const m of Object.keys(CLOUD.sig.roN || {})) {
    if (S.ro[m]) continue;
    for (let i = 0; i < CLOUD.sig.roN[m]; i++) await retry(() => db.doc(`ro/m${m}_${i}`).delete());
    delete CLOUD.sig.roN[m]; delete CLOUD.sig.ro[m];
  }
  // 2) VIN
  const vs = vinSig();
  const vchunks = [];
  const all = [...VINS];
  for (let i = 0; i < all.length; i += 6000) vchunks.push(all.slice(i, i + 6000).join(','));
  if (vs !== CLOUD.sig.vins) {
    for (let i = 0; i < vchunks.length; i++) await retry(() => db.doc(`vins/c${i}`).set({v: vchunks[i]}));
    CLOUD.sig.vins = vs;
  }
  // 3) núcleo
  const core = packCore();
  const str = JSON.stringify(core);
  if (str !== CLOUD.coreStr || !CLOUD.rev) {
    const rev = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    CLOUD.rev = rev;
    await retry(() => db.doc('plan/core').set({rev, savedAt: new Date().toISOString(), state: core, roIndex, vinsIndex: {sig: vs, n: vchunks.length}}));
    CLOUD.coreStr = str;
  }
  cloudSetStatus('☁ Guardado en la nube');
}

   Arranque

const RENDER = {resumen: renderResumen, plan: renderPlan, graficos: renderGraficos, importar: renderImportar, carga: renderCarga, objetivos: renderObjetivos, pasos: renderPasos, estructura: renderEstructura, cual: renderCual, config: renderConfig};
function seedRO() {
  if (typeof SEED_RO === 'undefined' || !SEED_RO) return;
  Object.entries(SEED_RO).forEach(([m, r]) => { if (!S.ro[m]) S.ro[m] = {file: r.file, fecha: r.fecha, periodo: r.periodo, lines: r.lines, agg: null}; });
